<!DOCTYPE html>
<html lang="ro" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alocare Personal — Activități</title>
<style>
:root {
  --bg:#0f1117;--bg2:#181b23;--bg3:#1e2130;--bg4:#252840;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);
  --text:#f0f1f5;--text2:#9ba3bb;--text3:#5c6480;
  --accent:#4f8ef7;--accent-bg:rgba(79,142,247,0.13);--accent-text:#7aaeff;
  --success:#34d399;--danger:#f87171;--warning:#fbbf24;
  --danger-bg:rgba(248,113,113,0.12);--success-bg:rgba(52,211,153,0.1);
  --radius:8px;--radius-lg:12px;
}
[data-theme="light"] {
  --bg:#f0f2f5;--bg2:#ffffff;--bg3:#f5f6f9;--bg4:#e8eaf0;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);
  --text:#1a1d2e;--text2:#5c6480;--text3:#9ba3bb;
  --accent:#2563eb;--accent-bg:rgba(37,99,235,0.08);--accent-text:#1d4ed8;
  --success:#16a34a;--danger:#dc2626;--warning:#d97706;
  --danger-bg:rgba(220,38,38,0.08);--success-bg:rgba(22,163,74,0.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:11px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.topbar-left{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;font-weight:800}
.topbar-title{font-size:14px;font-weight:600}
.topbar-sub{font-size:11px;color:var(--text3);margin-top:1px}
.topbar-right{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.clock{font-size:12px;color:var(--text2);background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:4px 10px}
.sync-pill{font-size:11px;padding:4px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg3);display:flex;align-items:center;gap:5px}
.sdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sdot-ok{background:var(--success)}.sdot-warn{background:var(--warning);animation:blink 1s infinite}.sdot-err{background:var(--danger)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--radius);border:1px solid var(--border2);background:transparent;color:var(--text);font-size:12px;cursor:pointer;font-family:inherit;transition:background .15s}
.btn:hover{background:var(--bg3)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}.btn-accent:hover{opacity:.88;background:var(--accent)}
.btn-danger{background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.btn-success{background:var(--success-bg);border-color:var(--success);color:var(--success)}
.btn-sm{padding:4px 9px;font-size:11px}
.btn-icon{background:none;border:none;color:var(--text3);cursor:pointer;padding:2px 5px;border-radius:4px;font-size:15px;line-height:1}
.btn-icon:hover{color:var(--danger);background:var(--danger-bg)}
.btn-dealloc{background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;line-height:1;padding:0 3px;border-radius:4px}
.btn-dealloc:hover{color:var(--danger)}
.main{display:grid;grid-template-columns:1fr 270px;gap:18px;padding:18px 20px;align-items:start}
.section-head{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em}
.section-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.person-list{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.person-row{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid var(--border);background:var(--bg2);transition:background .12s}
.person-row:last-child{border-bottom:none}
.person-row:hover{background:var(--bg3)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-bg);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;border:1px solid rgba(79,142,247,.2)}
.person-name{font-size:13px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;flex-shrink:0}
.tag-none{background:var(--bg4);color:var(--text3);border:1px solid var(--border)}
.sc-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
.person-actions{display:flex;align-items:center;gap:5px;flex-shrink:0}
.sel-act{font-size:11px;font-family:inherit;border:1px solid var(--border2);border-radius:var(--radius);padding:4px 6px;background:var(--bg3);color:var(--text);cursor:pointer;max-width:115px}
.sel-act:focus{outline:none;border-color:var(--accent)}
.chk-sc{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--text2);cursor:pointer;white-space:nowrap}
.chk-sc input{cursor:pointer;accent-color:var(--accent)}
.right-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:14px;overflow:hidden}
.right-card-head{padding:9px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.act-row{display:flex;align-items:center;gap:7px;padding:8px 13px;border-bottom:1px solid var(--border);font-size:13px;transition:background .12s}
.act-row:last-child{border-bottom:none}
.act-row:hover{background:var(--bg3)}
.act-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.act-name{flex:1;font-weight:500}
.act-info{font-size:11px;color:var(--text3)}
.act-del{background:none;border:none;color:var(--text3);cursor:pointer;padding:2px 4px;border-radius:4px;font-size:12px;line-height:1}
.act-del:hover{color:var(--danger)}
.sc-body{padding:13px}
.sc-nums{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
.sc-big{font-size:30px;font-weight:700;line-height:1}
.sc-lbl{font-size:11px;color:var(--text3);margin-top:2px}
.sc-right{text-align:right}
.sc-right .sc-big{font-size:20px;color:var(--text2)}
.sc-bar-wrap{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden}
.sc-bar-fill{height:100%;border-radius:3px;transition:width .4s,background .4s}
.summary-group{padding:8px 13px;border-bottom:1px solid var(--border)}
.summary-group:last-child{border-bottom:none}
.summary-group-head{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.summary-chips{display:flex;flex-wrap:wrap;gap:4px}
.summary-chip{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:500}
.empty-row{padding:16px;text-align:center;font-size:13px;color:var(--text3);background:var(--bg2)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:1.4rem;width:360px;max-width:95vw;max-height:90vh;overflow:auto}
.modal.wide{width:560px}
.modal h3{font-size:15px;font-weight:600;margin-bottom:13px}
.modal label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px;margin-top:11px}
.modal input,.modal select{width:100%;font-size:13px;font-family:inherit;padding:7px 10px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--bg3);color:var(--text)}
.modal input:focus,.modal select:focus{outline:none;border-color:var(--accent)}
.modal input::placeholder{color:var(--text3)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.color-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.color-swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .15s}
.color-swatch.active{border-color:var(--text)}
.sc-edit-row{display:flex;align-items:center;gap:10px}
.sc-edit-row input{width:80px;text-align:center;font-size:18px;font-weight:700;padding:6px}
.sc-edit-row .sc-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sc-edit-row .sc-btn:hover{background:var(--bg4)}
.confirm-box{background:var(--danger-bg);border:1px solid var(--danger);border-radius:var(--radius);padding:10px 13px;font-size:12px;color:var(--danger);margin-top:10px}
.info-box{background:var(--accent-bg);border:1px solid rgba(79,142,247,.3);border-radius:var(--radius);padding:10px 13px;font-size:12px;color:var(--accent-text);margin-top:10px;line-height:1.6}
.code-box{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px;font-family:ui-monospace,Consolas,monospace;font-size:10px;line-height:1.45;color:var(--text2);max-height:150px;overflow:auto;white-space:pre;margin-top:8px}
.steps{margin:8px 0 0 18px;font-size:12px;color:var(--text2);line-height:1.65}
.toast{position:fixed;bottom:20px;right:20px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 16px;font-size:13px;z-index:200;transform:translateY(60px);opacity:0;transition:all .3s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}
.toast.ok{border-color:var(--success);color:var(--success)}
.toast.warn{border-color:var(--warning);color:var(--warning)}
.toast.err{border-color:var(--danger);color:var(--danger)}
.filter-bar{display:flex;flex-direction:column;gap:0;margin-bottom:10px}
.filter-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--text2);font-family:inherit;transition:all .15s}
.filter-chip:hover{background:var(--bg3)}
.filter-chip.active{color:#fff;border-color:transparent}
.filter-chip .fc-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.stat-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px 12px;text-align:center}
.stat-box-val{font-size:22px;font-weight:700;color:var(--text);line-height:1}
.stat-box-lbl{font-size:10px;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:.05em}
.stat-box-accent{border-color:rgba(79,142,247,.3);background:rgba(79,142,247,.06)}
.stat-box-accent .stat-box-val{color:var(--accent-text)}
.stat-box-success{border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.06)}
.stat-box-success .stat-box-val{color:var(--success)}
.stat-box-danger{border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.06)}
.stat-box-danger .stat-box-val{color:var(--danger)}
.stat-box-warn{border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.06)}
.stat-box-warn .stat-box-val{color:var(--warning)}
.loading{display:flex;align-items:center;justify-content:center;min-height:60vh;flex-direction:column;gap:12px}
.spinner{width:32px;height:32px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.snap-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.snap-table th{padding:5px 8px;text-align:left;color:var(--text3);border-bottom:1px solid var(--border);font-weight:600}
.snap-table td{padding:5px 8px;border-bottom:1px solid var(--border);color:var(--text2)}
.snap-table tr:last-child td{border-bottom:none}
.badge-count{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:20px;font-size:11px;font-weight:600}
</style>
</head>
<body>

<div id="loading-screen" class="loading">
  <div class="spinner"></div>
  <div style="font-size:13px;color:var(--text3)">Se încarcă...</div>
</div>

<div id="app-screen" style="display:none">
  <div class="topbar">
    <div class="topbar-left">
      <div class="logo">D</div>
      <div>
        <div class="topbar-title">Alocare Personal — Activități</div>
        <div class="topbar-sub" id="topbar-sub">Depozit · salvare locală + Drive</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="clock" id="clock">—</div>
      <div class="sync-pill" id="sync-pill"><span class="sdot sdot-warn"></span><span id="sync-txt">Pornire...</span></div>
      <button class="btn btn-sm" onclick="openDriveModal()">☁ Drive</button>
      <button class="btn btn-sm" onclick="triggerImport()">⬆ Import CSV</button>
      <button class="btn btn-sm btn-success" onclick="exportExcel()">⬇ Istoric Excel</button>
      <button class="btn btn-sm btn-danger" onclick="openResetModal()">↺ Zi nouă</button>
      <button class="btn btn-sm" onclick="toggleTheme()" id="theme-btn">☀ Light</button>
      <input type="file" id="csv-input" accept=".csv,.txt" style="display:none" onchange="importCSV(event)">
    </div>
  </div>

  <div class="main">
    <div class="col-left">
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px" id="stats-bar">
        <div class="stat-box">
          <div class="stat-box-val" id="stat-total">0</div>
          <div class="stat-box-lbl">Total personal</div>
        </div>
        <div class="stat-box stat-box-danger">
          <div class="stat-box-val" id="stat-lipsa">0</div>
          <div class="stat-box-lbl">Lipsă</div>
        </div>
        <div class="stat-box stat-box-accent">
          <div class="stat-box-val" id="stat-prezent">0</div>
          <div class="stat-box-lbl">Prezent</div>
        </div>
        <div class="stat-box stat-box-warn">
          <div class="stat-box-val" id="stat-nealocat">0</div>
          <div class="stat-box-lbl">Nealocați</div>
        </div>
        <div class="stat-box stat-box-success">
          <div class="stat-box-val" id="stat-alocat">0</div>
          <div class="stat-box-lbl">Alocați</div>
        </div>
      </div>
      <div class="section-top">
        <span class="section-head">Listă personal</span>
        <button class="btn btn-sm" onclick="openModal('person')">+ Adaugă persoană</button>
      </div>
      <div class="filter-bar" id="filter-bar"></div>
      <div class="person-list" id="person-list"></div>
    </div>
    <div class="col-right">
      <div class="right-card">
        <div class="right-card-head">
          <span class="section-head">Activități</span>
          <button class="btn btn-sm" onclick="openModal('activity')">+ Nou</button>
        </div>
        <div id="act-list"></div>
      </div>
      <div class="right-card">
        <div class="right-card-head">
          <span class="section-head">Scanere</span>
          <button class="btn btn-sm" onclick="openModal('scanner')">Editează</button>
        </div>
        <div class="sc-body">
          <div class="sc-nums">
            <div><div class="sc-big" id="sc-free">20</div><div class="sc-lbl">disponibile</div></div>
            <div class="sc-right"><div class="sc-big" id="sc-used">0</div><div class="sc-lbl">alocate</div></div>
          </div>
          <div class="sc-bar-wrap"><div class="sc-bar-fill" id="sc-bar" style="width:100%"></div></div>
          <div id="sc-necesar-row" style="display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <span style="font-size:12px;color:var(--text2)">Necesar suplimentar</span>
              <span id="sc-necesar-val" style="font-size:18px;font-weight:700;color:var(--danger)">0</span>
            </div>
            <div style="font-size:11px;color:var(--text3);margin-top:3px">scanere peste limita disponibilă</div>
          </div>
        </div>
      </div>
      <div class="right-card">
        <div class="right-card-head"><span class="section-head">Rezumat activități</span></div>
        <div id="act-summary"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-bg" onclick="handleOverlay(event)">
  <div class="modal" id="modal-box">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-btns" id="modal-btns">
      <button class="btn" onclick="closeModal()">Anulează</button>
      <button class="btn btn-accent" onclick="confirmModal()">Salvează</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const API_KEY    = '$2a$10$rtd7gpdDdPQeT2wKjiJVEu3clcr2.W7sm95Dx5w.Cehp9FR5mKdyC';
const BASE_URL   = 'https://api.jsonbin.io/v3';
const DEPOT_NAME = 'depozit-central';
const BIN_STORE  = 'depot_bin_id_v2';
const HIST_STORE = 'depot_hist_bin_v1';
const STATE_STORE= 'depot_state_local_v2';
const HIST_LOCAL = 'depot_hist_local_v2';
const DRIVE_STORE= 'depot_drive_webapp_url';
const SNAP_STORE = 'depot_last_snap_date';
const FIXED_BIN_ID  = '6a3e47e2da38895dfe01d9d5';
const FIXED_HIST_ID = '6a3e5895da38895dfe0221b8';
const DRIVE_EMAIL   = 'otter.valentin@gmail.com';
const POLL_MS    = 5000;
const SNAP_HOUR  = 18;
const PRESET_COLORS = ['#4f8ef7','#34d399','#f59e0b','#f87171','#a78bfa','#fb7185','#22d3ee','#84cc16','#e879f9'];

const GAS_CODE = `function doPost(e) {
  var data = JSON.parse(e.postData.contents);
  var props = PropertiesService.getScriptProperties();
  var id = props.getProperty('SHEET_ID');
  var ss = null;
  if (id) { try { ss = SpreadsheetApp.openById(id); } catch (err) { ss = null; } }
  if (!ss) {
    ss = SpreadsheetApp.create('Istoric Alocare Depozit');
    props.setProperty('SHEET_ID', ss.getId());
  }
  var sh = ss.getSheets()[0];
  sh.setName('Istoric zilnic');
  var acts = [];
  (data.rows || []).forEach(function(row) {
    (row.snapshot || []).forEach(function(s) {
      if (!acts.some(function(a){ return a.actId === s.actId; })) {
        acts.push({ actId: s.actId, label: s.label });
      }
    });
  });
  var header = ['Data'];
  acts.forEach(function(a){ header.push(a.label + ' — pers'); header.push(a.label + ' — sc'); });
  header.push('Total persoane'); header.push('Total scanere');
  var values = [header];
  (data.rows || []).forEach(function(row) {
    var r = [row.date];
    acts.forEach(function(a) {
      var s = (row.snapshot || []).filter(function(x){ return x.actId === a.actId; })[0];
      r.push(s ? s.persons : 0);
      r.push(s ? s.scanere : 0);
    });
    r.push(row.totalPersons || 0);
    r.push(row.totalScanere || 0);
    values.push(r);
  });
  sh.clear();
  if (values.length) sh.getRange(1, 1, values.length, values[0].length).setValues(values);
  sh.autoResizeColumns(1, Math.max(1, values[0].length));
  return ContentService.createTextOutput('ok');
}
function doGet() {
  return ContentService.createTextOutput('Backup Alocare Depozit este activ.');
}`;

let binId     = null;
let histBinId = null;
let cloudOk   = false;
let state = {
  totalScanere:20, nextPid:1, nextAid:100,
  activities:[
    {id:'online',   label:'Online',   color:'#4f8ef7'},
    {id:'magazine', label:'Magazine', color:'#34d399'},
    {id:'ferme',    label:'Ferme',    color:'#f59e0b'},
    {id:'receptii', label:'Recepții', color:'#fb7185'},
  ],
  persons:[]
};
let history = { rows: [] };

let selectedColor   = PRESET_COLORS[0];
let modalCb         = null;
let isSaving        = false;
let pendingSave     = false;
let userActiveUntil = 0;
let lastSnapDate    = localStorage.getItem(SNAP_STORE);
let snapCheckTimer  = null;

function userActive(){ userActiveUntil = Date.now() + 8000; }

function showApp(){
  document.getElementById('loading-screen').style.display='none';
  document.getElementById('app-screen').style.display='block';
}

function loadLocal(){
  try {
    const s = localStorage.getItem(STATE_STORE);
    if(s){
      const parsed = JSON.parse(s);
      if(parsed && typeof parsed==='object'){
        state = parsed;
        if(!state.persons) state.persons=[];
        if(!state.activities) state.activities=[];
      }
    }
    const h = localStorage.getItem(HIST_LOCAL);
    if(h){
      const parsedH = JSON.parse(h);
      if(parsedH && Array.isArray(parsedH.rows)) history = parsedH;
    }
  } catch(e){}
}

function persistLocal(){
  try {
    localStorage.setItem(STATE_STORE, JSON.stringify(state));
    localStorage.setItem(HIST_LOCAL, JSON.stringify(history));
  } catch(e){}
}

function getDriveUrl(){ return (localStorage.getItem(DRIVE_STORE)||'').trim(); }

function updateTopbar(){
  const el = document.getElementById('topbar-sub');
  if(!el) return;
  const drive = getDriveUrl() ? 'Drive conectat' : 'Drive neconfigurat';
  el.textContent = cloudOk ? 'Depozit · cloud + '+drive : 'Depozit · local + '+drive;
}

async function init(){
  loadLocal();
  showApp();
  render();
  startSnapCheck();
  setSyncStatus('local');
  updateTopbar();
  await connectCloud();
  updateTopbar();
}

async function connectCloud(){
  binId     = localStorage.getItem(BIN_STORE)  || FIXED_BIN_ID;
  histBinId = localStorage.getItem(HIST_STORE) || FIXED_HIST_ID;
  localStorage.setItem(BIN_STORE,  binId);
  localStorage.setItem(HIST_STORE, histBinId);

  let ok = await fetchState(true);
  if(!ok){
    const created = await createBin(state, DEPOT_NAME);
    if(created){
      binId = created;
      localStorage.setItem(BIN_STORE, binId);
      ok = true;
      setSyncStatus('ok');
    }
  }
  await fetchHistory();
  if(!histBinId || !(await histBinExists())){
    const hid = await createBin(history.rows.length ? history : {rows:[]}, DEPOT_NAME+'-istoric');
    if(hid){
      histBinId = hid;
      localStorage.setItem(HIST_STORE, histBinId);
      await apiFetch(`${BASE_URL}/b/${histBinId}`,'PUT',history);
    }
  }

  cloudOk = !!ok;
  if(cloudOk){
    setSyncStatus('ok');
    startPolling();
  } else {
    setSyncStatus('local');
  }
}

function apiFetch(url,method='GET',body=null,binName=null){
  const headers={'X-Master-Key':API_KEY,'Content-Type':'application/json'};
  if(binName) headers['X-Bin-Name']=binName;
  const opts={method,headers};
  if(body) opts.body=JSON.stringify(body);
  return fetch(url,opts);
}

async function createBin(payload, name){
  try {
    const r = await apiFetch(`${BASE_URL}/b`,'POST',payload,name);
    if(!r.ok) return null;
    const d = await r.json();
    return (d.metadata && (d.metadata.id || d.metadata.parentId)) || null;
  } catch(e){ return null; }
}

async function histBinExists(){
  if(!histBinId) return false;
  try {
    const r = await apiFetch(`${BASE_URL}/b/${histBinId}/latest`);
    return r.ok;
  } catch(e){ return false; }
}

async function fetchState(force=false){
  if(!binId) return false;
  if(!force && Date.now()<userActiveUntil) return;
  try {
    const r=await apiFetch(`${BASE_URL}/b/${binId}/latest`);
    if(!r.ok) throw new Error();
    const d=await r.json();
    if(d.record){
      const incoming = d.record;
      const incomingCount = (incoming.persons||[]).length;
      const localCount = (state.persons||[]).length;
      if(incomingCount || !localCount){
        state=incoming;
        if(!state.persons)state.persons=[];
        if(!state.activities)state.activities=[];
        persistLocal();
      }
    }
    if(Date.now()>=userActiveUntil) render();
    setSyncStatus('ok');
    cloudOk = true;
    return true;
  } catch(e){ if(force) setSyncStatus('local'); else setSyncStatus('err'); return false; }
}

async function pushState(){
  persistLocal();
  if(!cloudOk || !binId) return;
  if(isSaving){pendingSave=true;return;}
  isSaving=true; setSyncStatus('saving');
  try {
    const r=await apiFetch(`${BASE_URL}/b/${binId}`,'PUT',state);
    if(!r.ok) throw new Error('HTTP '+r.status);
    setSyncStatus('ok');
  } catch(e){ setSyncStatus('err'); showToast('Salvat local. Cloud: '+e.message,'warn'); }
  finally { isSaving=false; if(pendingSave){pendingSave=false;pushState();} }
}

async function fetchHistory(){
  if(!histBinId) return;
  try {
    const r=await apiFetch(`${BASE_URL}/b/${histBinId}/latest`);
    if(!r.ok) return;
    const d=await r.json();
    if(d.record && Array.isArray(d.record.rows) && d.record.rows.length >= (history.rows||[]).length){
      history=d.record;
      persistLocal();
    }
  } catch(e){}
}

async function pushHistory(){
  persistLocal();
  if(histBinId && cloudOk){
    try { await apiFetch(`${BASE_URL}/b/${histBinId}`,'PUT',history); } catch(e){}
  }
  sendHistoryToDrive();
}

function sendHistoryToDrive(){
  const url = getDriveUrl();
  if(!url) return false;
  try {
    fetch(url, {
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({
        email: DRIVE_EMAIL,
        updatedAt: new Date().toISOString(),
        rows: history.rows || []
      })
    });
    return true;
  } catch(e){ return false; }
}

let pollTimer=null;
function startPolling(){ if(pollTimer)clearInterval(pollTimer); pollTimer=setInterval(()=>fetchState(false),POLL_MS); }

function setSyncStatus(s){
  const dot=document.querySelector('#sync-pill .sdot'); const txt=document.getElementById('sync-txt'); if(!dot)return;
  dot.className='sdot';
  if(s==='ok'){dot.classList.add('sdot-ok');txt.textContent='Sincronizat';}
  else if(s==='saving'){dot.classList.add('sdot-warn');txt.textContent='Salvare...';}
  else if(s==='local'){dot.classList.add('sdot-warn');txt.textContent='Mod local';}
  else{dot.classList.add('sdot-err');txt.textContent='Deconectat';}
}

function startSnapCheck(){
  if(snapCheckTimer) clearInterval(snapCheckTimer);
  snapCheckTimer = setInterval(checkSnapshot, 30000);
  checkSnapshot();
}

function todayStr(){
  return new Date().toLocaleDateString('ro-RO',{day:'2-digit',month:'2-digit',year:'numeric'});
}

function checkSnapshot(){
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes();
  const today = todayStr();
  if(h===SNAP_HOUR && m<5 && lastSnapDate!==today){
    const hasData = state.persons.some(p=>p.actId);
    if(hasData){
      lastSnapDate = today;
      localStorage.setItem(SNAP_STORE, today);
      doSnapshot(today);
    }
  }
}

async function doSnapshot(dateStr, silent=false){
  await fetchHistory();
  if(history.rows.find(r=>r.date===dateStr)) {
    if(!silent) showToast('Snapshot pentru '+dateStr+' există deja','warn');
    sendHistoryToDrive();
    return;
  }
  const snapshot = state.activities.map(a=>({
    actId:   a.id,
    label:   a.label,
    color:   a.color,
    persons: state.persons.filter(p=>p.actId===a.id).length,
    scanere: state.persons.filter(p=>p.actId===a.id&&p.scaner).length,
  }));
  const totalPersons = state.persons.filter(p=>p.actId).length;
  const totalScanere = state.persons.filter(p=>p.actId&&p.scaner).length;
  history.rows.push({ date:dateStr, snapshot, totalPersons, totalScanere });
  await pushHistory();
  if(!silent){
    showToast('Snapshot '+dateStr+' salvat ✓'+(getDriveUrl()?' (Drive)':''),'ok');
  } else {
    openSnapshotNotif(dateStr, snapshot, totalPersons, totalScanere);
  }
}

  modalCb=null;

function buildExcelWorkbook(){
  const allActs = [];
  history.rows.forEach(row=>{
    (row.snapshot||[]).forEach(s=>{
      if(!allActs.find(a=>a.actId===s.actId)) allActs.push({actId:s.actId,label:s.label});
    });
  });
  state.activities.forEach(a=>{
    if(!allActs.find(x=>x.actId===a.id)) allActs.push({actId:a.id,label:a.label});
  });
  const header = ['Data'];
  allActs.forEach(a=>{ header.push(a.label+' — pers'); header.push(a.label+' — sc'); });
  header.push('Total persoane'); header.push('Total scanere');
  const wsData = [header];
  history.rows.forEach(row=>{
    const r = [row.date];
    allActs.forEach(a=>{
      const s = (row.snapshot||[]).find(x=>x.actId===a.actId);
      r.push(s ? s.persons : 0);
      r.push(s ? s.scanere : 0);
    });
    r.push(row.totalPersons||0);
    r.push(row.totalScanere||0);
    wsData.push(r);
  });
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols'] = wsData[0].map((h,i)=>({wch: i===0?14:18}));
  XLSX.utils.book_append_sheet(wb, ws, 'Istoric zilnic');
  const ws2Data = [['Activitate','Persoane alocate','Scanere alocate']];
  state.activities.forEach(a=>{
    ws2Data.push([
      a.label,
      state.persons.filter(p=>p.actId===a.id).length,
      state.persons.filter(p=>p.actId===a.id&&p.scaner).length
    ]);
  });
  ws2Data.push(['TOTAL',
    state.persons.filter(p=>p.actId).length,
    state.persons.filter(p=>p.actId&&p.scaner).length
  ]);
  const ws2 = XLSX.utils.aoa_to_sheet(ws2Data);
  ws2['!cols']=[{wch:20},{wch:20},{wch:18}];
  XLSX.utils.book_append_sheet(wb, ws2, 'Situatie curenta');
  return wb;
}

async function exportExcel(){
  await fetchHistory();
  if(!history.rows.length){
    showToast('Nu există date istorice încă','warn');
    return;
  }
  if(typeof XLSX==='undefined'){
    showToast('Biblioteca Excel nu s-a încărcat. Verifică internetul.','err');
    return;
  }
  const wb = buildExcelWorkbook();
  const d=new Date().toLocaleDateString('ro-RO',{day:'2-digit',month:'2-digit',year:'numeric'}).replace(/\./g,'-');
  XLSX.writeFile(wb, `Alocare_Depozit_${d}.xlsx`);
  const sent = sendHistoryToDrive();
  showToast(sent ? 'Excel descărcat și istoric trimis pe Drive ✓' : 'Excel descărcat ✓','ok');
}

  const lipsaId  = lipsaAct ? lipsaAct.id : null;

  const row1 = [];
  row1.push(`<button class="filter-chip${activeFilter==='all'?' active':''}"

      style="${isActive?`background:${lipsaAct.color};border-color:${lipsaAct.color};color:#fff`:`border-color:${hexRgba(lipsaAct.color,.5)};color:${lipsaAct.color}`}"

    onclick="setFilter('nealocat')">Nealocați <span style="opacity:.7">${nealocat}</span></button>`);
  state.activities.filter(a=>a.id!==lipsaId).forEach(a=>{
    const cnt = state.persons.filter(p=>p.actId===a.id).length;

    row2.push(`<button class="filter-chip${isActive?' active':''}"

function setFilter(f){
  activeFilter = f;
  renderFilterBar();
  renderPersons();
}

function renderPersons(){
  const el=document.getElementById('person-list');
  const lipsaAct = state.activities.find(a=>a.label.toUpperCase()==='LIPSA'||a.label.toUpperCase()==='LIPSĂ');
  const lipsaId  = lipsaAct ? lipsaAct.id : null;
  const total    = state.persons.length;
  const lipsa    = lipsaId ? state.persons.filter(p=>p.actId===lipsaId).length : 0;
  const prezent  = total - lipsa;
  const alocat   = state.persons.filter(p=>p.actId && p.actId!==lipsaId).length;
  const nealocat = prezent - alocat;
  document.getElementById('stat-total').textContent    = total;
  document.getElementById('stat-lipsa').textContent    = lipsa;
  document.getElementById('stat-prezent').textContent  = prezent;
  document.getElementById('stat-alocat').textContent   = alocat;
  document.getElementById('stat-nealocat').textContent = Math.max(0,nealocat);
  let filtered = state.persons;
  if(activeFilter==='nealocat')       filtered = state.persons.filter(p=>!p.actId);
  else if(activeFilter!=='all')       filtered = state.persons.filter(p=>p.actId===activeFilter);
  if(!filtered.length){
    el.innerHTML=`<div class="empty-row">${activeFilter==='all'?'Nicio persoană. Adaugă sau importă CSV.':'Nicio persoană în această categorie.'}</div>`;
    return;
  }
  el.innerHTML=filtered.map(p=>{
    const act=state.activities.find(a=>a.id===p.actId);
    const hasSc=p.actId&&p.scaner;
    const tagSty=act?`background:${hexRgba(act.color,.14)};color:${act.color};border:1px solid ${hexRgba(act.color,.3)}`:'';

      <div class="avatar">${initials(p.name)}</div>

        ${act?act.label:'Nealocată'}${hasSc?'<span class="sc-dot"></span>':''}
      </span>
      <div class="person-actions">
        ${p.actId
          ?`<button class="btn-dealloc" onclick="deallocPerson(${p.id})">×</button>`
          :`<select class="sel-act" id="sel-${p.id}" onchange="userActive();toggleScanerChk(${p.id})" onfocus="userActive()">
              <option value="">Activitate...</option>
              ${[...state.activities].sort((a,b)=>{
                const aL=a.label.toUpperCase()==='LIPSA'||a.label.toUpperCase()==='LIPSĂ';

        }

function renderScanere(){
  const used=usedScanere();
  const efectiv=Math.min(used,state.totalScanere);
  const free=Math.max(0,state.totalScanere-used);
  const necesar=Math.max(0,used-state.totalScanere);
  document.getElementById('sc-free').textContent=free;
  document.getElementById('sc-used').textContent=efectiv;
  const pct=state.totalScanere>0?(free/state.totalScanere)*100:0;
  const bar=document.getElementById('sc-bar');
  bar.style.width=necesar>0?'100%':pct+'%';
  bar.style.background=necesar>0||pct<25?'#f87171':pct<50?'#fbbf24':'#34d399';
  const necesarRow=document.getElementById('sc-necesar-row');
  if(necesar>0){
    necesarRow.style.display='block';
    document.getElementById('sc-necesar-val').textContent='+'+necesar;
  } else {
    necesarRow.style.display='none';
  }
}

function toggleScanerChk(pid){
  const sel=document.getElementById('sel-'+pid);
  const chk=document.getElementById('chk-'+pid);
  const lbl=document.getElementById('lbl-chk-'+pid);
  if(!sel||!chk||!lbl) return;
  const lipsaAct=state.activities.find(a=>a.label.toUpperCase()==='LIPSA'||a.label.toUpperCase()==='LIPSĂ');
  const isLipsa = lipsaAct && sel.value===lipsaAct.id;
  chk.disabled = isLipsa;
  chk.checked  = isLipsa ? false : chk.checked;
  lbl.style.opacity = isLipsa ? '0.3' : '1';
  lbl.style.pointerEvents = isLipsa ? 'none' : '';
}

function allocPerson(pid){
  const sel=document.getElementById('sel-'+pid); const chk=document.getElementById('chk-'+pid);
  const actId=sel?sel.value:'';
  if(!actId){showToast('Selectează o activitate mai întâi','warn');return;}
  const wantsSc=chk?chk.checked:false;
  const used=usedScanere();
  if(wantsSc && used>=state.totalScanere){
    showToast('Atenție: depășești numărul de scanere disponibile!','warn');
  }
  const p=state.persons.find(x=>x.id===pid);
  if(p){p.actId=actId;p.scaner=wantsSc;}
  userActiveUntil=0; render(); pushState();
}
function deallocPerson(pid){const p=state.persons.find(x=>x.id===pid);if(p){p.actId=null;p.scaner=false;}render();pushState();}
function removePerson(pid){state.persons=state.persons.filter(p=>p.id!==pid);render();pushState();}
function removeActivity(aid){
  state.persons.forEach(p=>{if(p.actId===aid){p.actId=null;p.scaner=false;}});
  state.activities=state.activities.filter(a=>a.id!==aid);render();pushState();
}

function resetModalBtns(){
  document.getElementById('modal-box').classList.remove('wide');
  document.getElementById('modal-btns').innerHTML=`
    <button class="btn" onclick="closeModal()">Anulează</button>
    <button class="btn btn-accent" onclick="confirmModal()">Salvează</button>`;
}

function openModal(mode){
  userActive(); selectedColor=PRESET_COLORS[0];
  document.getElementById('modal-bg').classList.add('open');
  resetModalBtns();
  const title=document.getElementById('modal-title'); const body=document.getElementById('modal-body');
  if(mode==='person'){
    title.textContent='Adaugă persoană';
    body.innerHTML=`<label>Nume complet</label><input id="m-name" placeholder="Prenume Nume" autofocus/>`;
    modalCb=()=>{const n=document.getElementById('m-name').value.trim();if(!n)return false;state.persons.push({id:state.nextPid++,name:n,actId:null,scaner:false});showToast('Persoană adăugată','ok');return true;};
  } else if(mode==='activity'){
    title.textContent='Activitate nouă';
    body.innerHTML=`<label>Nume activitate</label><input id="m-aname" placeholder="ex: Sortare" autofocus/>
      <label>Culoare</label>
      <div class="color-row">${PRESET_COLORS.map((c,i)=>`<div class="color-swatch${i===0?' active':''}" style="background:${c}" data-color="${c}" onclick="pickColor(this)"></div>`).join('')}</div>
      <label>Sau alege manual</label>
      <input type="color" id="m-color" value="${PRESET_COLORS[0]}" oninput="selectedColor=this.value" style="width:50px;height:30px;padding:2px;border-radius:var(--radius);border:1px solid var(--border2);cursor:pointer;background:var(--bg3)"/>`;
    modalCb=()=>{const n=document.getElementById('m-aname').value.trim();if(!n)return false;state.activities.push({id:'act_'+state.nextAid++,label:n,color:selectedColor});showToast('Activitate adăugată','ok');return true;};
  } else if(mode==='scanner'){
    title.textContent='Total scanere';
    body.innerHTML=`<label>Număr total scanere</label>
      <div class="sc-edit-row">
        <button class="sc-btn" onclick="chSc(-1)">−</button>
        <input type="number" id="m-sc" value="${state.totalScanere}" min="1" max="500"/>
        <button class="sc-btn" onclick="chSc(1)">+</button>
      </div>`;
    modalCb=()=>{const v=parseInt(document.getElementById('m-sc').value);if(isNaN(v)||v<1)return false;state.totalScanere=v;showToast('Scanere actualizate','ok');return true;};
  }
}

function openResetModal(){
  userActive();
  document.getElementById('modal-bg').classList.add('open');
  resetModalBtns();
  document.getElementById('modal-title').textContent='Zi nouă — resetare';
  document.getElementById('modal-body').innerHTML=`
    <div class="confirm-box">Elimină <strong>toate alocările</strong>. Personalul și activitățile rămân.</div>
    <label style="margin-top:14px;display:flex;align-items:center;gap:6px;cursor:pointer">
      <input type="checkbox" id="chk-reset-persons" style="cursor:pointer;accent-color:var(--accent)">
      Șterge și lista de personal
    </label>
    <div class="info-box" style="margin-top:10px">Dacă există date alocate, se va salva un snapshot în istoric (și pe Drive, dacă e configurat) înainte de resetare.</div>`;
  modalCb=async()=>{
    const delP=document.getElementById('chk-reset-persons')?.checked;
    const today=todayStr();
    const hasData=state.persons.some(p=>p.actId);
    if(hasData && !history.rows.find(r=>r.date===today)){
      await doSnapshot(today, true);
    }
    state.persons.forEach(p=>{p.actId=null;p.scaner=false;});
    if(delP) state.persons=[];
    showToast('Resetare completă ✓','ok');
    return true;
  };
}

function chSc(d){const el=document.getElementById('m-sc');if(el)el.value=Math.max(1,parseInt(el.value||1)+d);}
function pickColor(el){selectedColor=el.dataset.color;document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('active'));el.classList.add('active');const m=document.getElementById('m-color');if(m)m.value=selectedColor;}
function closeModal(){document.getElementById('modal-bg').classList.remove('open');document.getElementById('modal-box').classList.remove('wide');modalCb=null;userActiveUntil=0;}
async function confirmModal(){if(!modalCb)return;const res=await modalCb();if(res===false)return;closeModal();render();pushState();}
function handleOverlay(e){if(e.target===document.getElementById('modal-bg'))closeModal();}

function triggerImport(){document.getElementById('csv-input').click();}
function importCSV(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const lines=ev.target.result.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    let added=0;
    lines.forEach(line=>{
      const name=line.split(',')[0].replace(/"/g,'').trim();
      if(!name||['nume','name'].includes(name.toLowerCase()))return;
      if(!state.persons.some(p=>p.name.toLowerCase()===name.toLowerCase())){
        state.persons.push({id:state.nextPid++,name,actId:null,scaner:false});added++;
      }
    });
    render();pushState();showToast(`Import: ${added} persoane adăugate`,'ok');
  };
  reader.readAsText(file,'UTF-8');e.target.value='';
}

function initials(n){const p=n.trim().split(' ');return((p[0]?.[0]||'')+(p[1]?.[0]||'')).toUpperCase()}
function hexRgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`}
function usedScanere(){return state.persons.filter(p=>p.scaner&&p.actId).length}
function showToast(msg,type='ok'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast '+type+' show';setTimeout(()=>t.classList.remove('show'),3200)}

function toggleTheme(){
  const html=document.documentElement;const isDark=html.getAttribute('data-theme')==='dark';
  html.setAttribute('data-theme',isDark?'light':'dark');
  document.getElementById('theme-btn').textContent=isDark?'🌙 Dark':'☀ Light';
}

function updateClock(){
  const now=new Date();
  const clock=document.getElementById('clock');
  if(!clock) return;
  clock.textContent=
    now.toLocaleDateString('ro-RO',{weekday:'short',day:'numeric',month:'short'})+' · '+
    now.toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

setInterval(updateClock,1000);
updateClock();
init();
</script>
</body>
</html>
